name: MonitorMac
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "15.0"
  fileTypes:
    icon:
      file: true
packages:
  SessionMonitorCore:
    path: ../..
  SpecificationKit:
    url: https://github.com/SoundBlaster/SpecificationKit
    exactVersion: 4.0.1
  NestedA11yIDs:
    url: https://github.com/SoundBlaster/NestedA11yIDs
    exactVersion: 1.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  MonitorMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: SessionMonitor.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SessionMonitor
        PRODUCT_MODULE_NAME: SessionMonitor
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.session-monitor
        INFOPLIST_KEY_CFBundleDisplayName: SessionMonitor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: SessionMonitor
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Config/AppGroups.entitlements
    dependencies:
      - target: SessionMonitorWidgetExtension
        embed: true
      - package: SessionMonitorCore
        product: MonitorCore
      - package: SessionMonitorCore
        product: MonitorRuntime
      - package: SessionMonitorCore
        product: MonitorPolicies
      - package: SpecificationKit
      - package: NestedA11yIDs
  SessionMonitorWidgetExtension:
    type: app-extension
    platform: macOS
    info:
      path: Config/WidgetExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.session-monitor.widget
        PRODUCT_NAME: SessionMonitorWidgetExtension
        CODE_SIGN_ENTITLEMENTS: Config/AppGroups.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: SessionMonitorCore
        product: MonitorCore
  MonitorMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.SessionMonitor.Tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SessionMonitor.app/Contents/MacOS/SessionMonitor"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED: YES
    # Hosted tests resolve package symbols from the app; relinking static packages
    # duplicates GRDB's queue identity and causes runtime thread precondition failures.
    dependencies:
      - target: MonitorMac
  MonitorMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.egormerkushev.SessionMonitor.UITests
        TEST_TARGET_NAME: MonitorMac
        CODE_SIGNING_ALLOWED: YES
    dependencies:
      - target: MonitorMac

schemes:
  MonitorMac:
    build:
      targets:
        MonitorMac: all
        SessionMonitorWidgetExtension: all
    test:
      targets: [MonitorMacTests, MonitorMacUITests]
